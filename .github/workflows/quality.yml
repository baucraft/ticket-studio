name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Audit dependencies
        run: npm audit

      - name: Build deployment artifact
        run: npm run build:deployment

      - name: Build GitHub Pages artifact
        run: npm run build
        env:
          VITE_BASE_PATH: /ticket-studio/

      - name: Build static preview image
        run: |
          docker build --file deployment/Dockerfile \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --tag ticket-studio:ci .

      - name: Verify hardened static preview image
        run: |
          docker run --detach --name ticket-studio-ci \
            --user 101:101 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --memory 128m \
            --pids-limit 100 \
            ticket-studio:ci
          for attempt in {1..30}; do
            if [ "$(docker inspect ticket-studio-ci --format '{{.State.Health.Status}}')" = healthy ]; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker logs ticket-studio-ci
              exit 1
            fi
            sleep 1
          done
          docker exec ticket-studio-ci wget --quiet --spider http://127.0.0.1:8080/
          docker exec ticket-studio-ci wget --quiet --spider http://127.0.0.1:8080/vendor/sheetjs-loader.mjs
          docker exec ticket-studio-ci wget --quiet --spider http://127.0.0.1:8080/vendor/xlsx-0.20.3.mjs
          docker inspect ticket-studio-ci | jq -e '
            .[0].Config.User == "101:101" and
            .[0].HostConfig.ReadonlyRootfs == true and
            .[0].HostConfig.CapDrop == ["ALL"] and
            .[0].HostConfig.SecurityOpt == ["no-new-privileges:true"] and
            .[0].HostConfig.Memory == 134217728 and
            .[0].HostConfig.PidsLimit == 100 and
            .[0].HostConfig.PortBindings == {}
          '

      - name: Stop static preview image
        if: always()
        run: docker rm --force ticket-studio-ci || true
