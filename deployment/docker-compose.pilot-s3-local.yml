services:
  pilot-backend:
    image: ticket-analyzer-pilot:s2-local
    user: "${PILOT_LOCAL_UID:?set uid}:${PILOT_LOCAL_GID:?set gid}"
    environment:
      PILOT_PROFILE: pilot-product-v1
      PILOT_CONFIG_FILE: /run/pilot/config.json
    volumes:
      - ${PILOT_LOCAL_ROOT:?set private synthetic test directory}/config.json:/run/pilot/config.json:ro
      - ${PILOT_LOCAL_ROOT}/credentials.json:/run/pilot/credentials.json:ro
      - ${PILOT_LOCAL_ROOT}/product:/var/lib/pilot
      - ${PILOT_LOCAL_ROOT}/allocation:/var/lib/pilot-allocation
      - ${PILOT_LOCAL_ROOT}/witness:/var/lib/pilot-witness
      - ${PILOT_LOCAL_ROOT}/auth:/var/lib/pilot-auth
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [pilot-local]
  pilot-proxy:
    image: nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    ports: ["127.0.0.1:${PILOT_LOCAL_PORT:-18443}:8443"]
    volumes:
      - ./nginx.pilot-s3-local.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PILOT_LOCAL_ROOT}/tls:/etc/nginx/tls:ro
      - ${PILOT_LOCAL_ROOT}/proxy-auth:/etc/nginx/auth:ro
      - ${PILOT_STUDIO_DIST:?set studio dist}:/usr/share/nginx/html:ro
    depends_on: [pilot-backend]
    networks: [pilot-local]
networks:
  pilot-local:
    internal: true
