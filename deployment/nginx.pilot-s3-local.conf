server {
    listen 8443 ssl;
    server_name ticket-studio.dreso.int;

    root /usr/share/nginx/html;
    index index.html;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    auth_basic "Static local test protection";
    auth_basic_user_file /etc/nginx/auth/htpasswd;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'none'" always;
    add_header Cache-Control "no-store" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /api/pilot/v1/ {
        auth_basic off;
        proxy_pass http://pilot-backend:8000;
        proxy_set_header Authorization "";
        proxy_set_header Host $host:8443;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ /\. {
        return 404;
    }

    location /vendor/ {
        default_type application/javascript;
        try_files $uri =404;
    }

    # Public official marker patterns only; project APIs keep cookie auth.
    location = /pilot-assets/tagCircle49h12.bits {
        auth_basic off;
        limit_except GET { deny all; }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
