server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'none'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'none'" always;
    add_header Cache-Control $cache_control always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location = /index.html {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /vendor/ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
